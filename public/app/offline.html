<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3EDE2">
<meta name="robots" content="noindex">
<title>Wishtale ohne Verbindung</title>
<style>
:root{--bg:#F3EDE2;--ink:#1F1B16;--muted:#5E564C;--accent:#2E3B2F;--accent-ink:#F6F0E4;--gold:#B8801F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1A17;--ink:#F3EDE2;--muted:#CFC6B8;--accent:#DCE5D5;--accent-ink:#1C1A17}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:420px;text-align:center}
.mark{font:400 34px/1 Georgia,serif;letter-spacing:-.02em;margin-bottom:28px}
.mark span{color:var(--gold)}
h1{font:400 28px/1.15 Georgia,serif;margin:0 0 12px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">wishtale<span>.</span></div>
<h1>Gerade ist keine Verbindung da</h1>
<p>Deine Wünsche liegen sicher in deinem Konto. Sobald dein Handy wieder online ist, geht es genau hier weiter.</p>
<a href="/app/">Noch einmal versuchen</a>
</main>
</body>
</html>
